# Force pnpm for install — without this, nixpacks's auto-detection has
# fallen back to npm on this Railway project and erred on the workspace:
# protocol used by our @battu/* packages.
#
# No build phase: the API runs TypeScript directly via `tsx` (see
# apps/api/package.json's `start` script), so no compile step is needed
# and the workspace packages (which expose ./src/index.ts as their entry)
# work as-is. The runtime start command lives in railway.toml.

[phases.setup]
nixPkgs = ["nodejs_22", "pnpm"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = []

[docker]
ports = [3000]
